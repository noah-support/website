services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: noah
      POSTGRES_PASSWORD: noah
      POSTGRES_DB: noah
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

volumes:
  pgdata:
  minio:
